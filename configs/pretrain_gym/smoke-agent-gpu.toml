# Pipeline check for a workspace with a GPU, on a host with two or more: 20M-token budget, 40 turns.
# Image: docker build --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu126 \
#   -f scripts/pretrain_gym/Dockerfile.agent -t pretrain-gym-agent:v1-gpu scripts/pretrain_gym
model = "deepseek/deepseek-v4-flash"
num_rollouts = 1
max_concurrent = 1
push = false

[env.taskset]
id = "pretrain-gym"

[env.taskset.task.workspace]
image = "pretrain-gym-agent:v1-gpu"
gpu = "1"

[env.taskset.task.scoring]
train_tokens = 20000000

# Docker gives the workspace GPU 0, so scoring leases the others.
[env.taskset.task.scoring.scorer]
gpus = [1]

[env.taskset.task.scoring.eval_set]
token_env = "SCORER_HF_TOKEN"

[env.taskset.task.hub]
max_download_gb = 50

[env.agent]
max_turns = 40

[env.agent.harness]
tool_timeout = 3600.0

[env.agent.runtime]
type = "docker"
allow = []
